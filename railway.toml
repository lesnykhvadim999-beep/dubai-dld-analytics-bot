[build]
builder = "NIXPACKS"

[deploy]
startCommand = "python main.py"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
# Reliability audit 2026-05-30: Railway pings /health (fsst_core.start_health_server, main.py:8864)
# 503 на упавшую БД → auto-restart. До этого Railway рестартил только на process exit.
healthcheckPath = "/health"
healthcheckTimeout = 30
